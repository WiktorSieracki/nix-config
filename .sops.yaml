keys:
  - &wiktor age167q7xacsugqxnace5zpyxf07lyw7gvzzgqjk4xhcd7pltn075q9qvgrta4
  # vpsNixos' own ssh host key (/etc/ssh/ssh_host_ed25519_key), never wiktor's
  # key — see modules/hosts/vps-nixos/notes.md.
  - &vpsNixos age1efnumvr2rfz0hrt20rhu2zqxq3shdygywhhh06lwkxlwd8w8zansyrvx7c
# Convert your SSH private key for SOPS CLI to use:
# mkdir -p ~/.config/sops/age
# nix-shell -p ssh-to-age --run 'ssh-to-age -private-key -i ~/.ssh/id_ed25519 > ~/.config/sops/age/keys.txt'

creation_rules:
  # Only what the VPS needs; it can't decrypt the main secrets.yaml.
  - path_regex: secrets-vps\.yaml$
    key_groups:
    - age:
        - *wiktor
        - *vpsNixos
  - path_regex: secrets.yaml$
    key_groups:
    - age:
        - *wiktor