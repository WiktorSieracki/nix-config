# Keeps the SHA-pinned `uses:` references in .github/workflows current.
# Every action is pinned to a full commit SHA with a trailing `# vX.Y.Z`
# comment (supply-chain hardening); Dependabot bumps both together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR a week for all action bumps. Ungrouped, every action got its own
    # PR, and a PR left open was replaced by the next bump of the same action
    # (#43 -> #53), so they piled up instead of landing.
    groups:
      actions:
        patterns: ["*"]
