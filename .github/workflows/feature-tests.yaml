name: Feature tests

# Feature tests (see docs/adr/0002-ai-first-testable-features.md).
#  - coverage:      cheap eval-time gate (every feature has meta+test) — no KVM, on PRs.
#  - feature-tests: full VM feature tests (nixosTest) — needs KVM, on main / manual, via Cachix.

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: feature-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hard gate: meta ⇔ feature-test consistency. Cheap, KVM-independent — blocks PRs.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: feature-coverage
        run: nix build -L '.#checks.x86_64-linux.feature-coverage'

  # Full VM feature tests. KVM can be flaky on runners — so not on every PR,
  # only on main and manually; green builds land in Cachix, so later ones are fast.
  feature-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: wimpysworld/nothing-but-nix@main
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - uses: cachix/cachix-action@v15
        with:
          name: wiktor-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build all feature tests
        run: |
          nix run nixpkgs#nix-fast-build -- \
            --no-nom \
            --skip-cached \
            --retries 2 \
            --cachix-cache wiktor-nixos \
            --flake '.#checks.x86_64-linux'
