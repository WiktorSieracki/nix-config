name: Feature tests

# Feature tests (harness: modules/feature-tests.nix, glossary: CONTEXT.md).
#  - coverage:      cheap eval-time gate (every feature has meta+test) — no KVM, on PRs.
#  - hosts:         every host and image still evaluates — no KVM, on PRs.
#  - feature-tests: full VM feature tests (nixosTest) — needs KVM, on main / manual, via Cachix.

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Least privilege: no job here writes to the repo. The token is read-only
# regardless of the repository's default token permissions.
permissions:
  contents: read

concurrency:
  group: feature-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hard gate: meta ⇔ feature-test consistency. Cheap, KVM-independent — blocks PRs.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The caches are listed here rather than in flake.nix's nixConfig (which
      # this repo deliberately does not have -- see the comment there). The same
      # two lines appear in every install-nix-action step across the workflows;
      # keep them identical. wiktor-nixos is named even where cachix-action
      # would also add it, so the block does not differ per job.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-community.cachix.org https://cache.numtide.com https://wiktor-nixos.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= wiktor-nixos.cachix.org-1:3DOZHbBhM0h+YZFUZ1zZikBSLC7cTbZglgQEhF7Gi2M=
      - name: feature-coverage
        run: nix build -L '.#checks.x86_64-linux.feature-coverage'
      - name: formatting
        run: nix build -L '.#checks.x86_64-linux.formatting'
      - name: lint
        run: nix build -L '.#checks.x86_64-linux.lint'

  # Hard gate: every host still evaluates. A feature test boots `core` plus one
  # feature, so a change that only breaks a whole host — two features defining
  # the same option, a host file, flake.meta, a package dropped from nixpkgs —
  # passed every check a PR runs and surfaced at the next `nh os switch`.
  # Evaluation only: forcing the toplevel's drvPath runs every assertion and
  # every option merge of the host without building anything. One host per
  # `nix eval`, so memory is released in between (a single process holding all
  # of them is what OOMs the desktop).
  hosts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same cache lines as every other install-nix-action step; keep them identical.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-community.cachix.org https://cache.numtide.com https://wiktor-nixos.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= wiktor-nixos.cachix.org-1:3DOZHbBhM0h+YZFUZ1zZikBSLC7cTbZglgQEhF7Gi2M=
      # The three real hosts plus the two image hosts (the ISO is otherwise
      # first evaluated by iso.yaml, after the merge). The per-feature
      # `sandbox-*` configurations are covered by checks.sandbox-eval.
      - name: Evaluate hosts
        run: |
          for host in desktopNixos laptopNixos vpsNixos iso vm; do
            echo "::group::$host"
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
            echo
            echo "::endgroup::"
          done

  # Full VM feature tests. KVM can be flaky on runners — so not on every PR,
  # only on main and manually; green builds land in Cachix, so later ones are fast.
  feature-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # root-safe-haven: the action carves an expansion disk out of / and the
      # default 2 GB reserve is not enough for the runner's own diag logs —
      # the 59 feature-test build log filled / and killed the worker itself
      # with ENOSPC (while /nix still had ~95 GB free). Same fix as iso.yaml.
      - name: Free disk space
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          root-safe-haven: '12288'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # build-dir MUST point at the /nix volume (nothing-but-nix creates
      # /nix/build exactly for this): without it the daemon builds the VM
      # images in /tmp on /, where little is left after the carve-out.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-community.cachix.org https://cache.numtide.com https://wiktor-nixos.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= wiktor-nixos.cachix.org-1:3DOZHbBhM0h+YZFUZ1zZikBSLC7cTbZglgQEhF7Gi2M=
            build-dir = /nix/build
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: wiktor-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # ciChecks = every check except the feature tests of features no host
      # enables (see modules/feature-tests.nix); those stay buildable locally.
      # --inputs-from: take nix-fast-build from the nixpkgs in flake.lock, not
      # from whatever `nixpkgs` the global registry points at that day. Same
      # tool version for every run of a commit, and no second nixpkgs to fetch.
      - name: Build feature tests of enabled features
        run: |
          nix run --inputs-from . nixpkgs#nix-fast-build -- \
            --no-nom \
            --skip-cached \
            --retries 2 \
            --cachix-cache wiktor-nixos \
            --flake '.#legacyPackages.x86_64-linux.ciChecks'
