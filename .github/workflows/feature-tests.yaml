name: Feature tests

# Feature tests (see docs/adr/0002-ai-first-testable-features.md).
#  - coverage:      cheap eval-time gate (every feature has meta+test) — no KVM, on PRs.
#  - feature-tests: full VM feature tests (nixosTest) — needs KVM, on main / manual, via Cachix.

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: feature-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hard gate: meta ⇔ feature-test consistency. Cheap, KVM-independent — blocks PRs.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The caches are listed here rather than in flake.nix's nixConfig (which
      # this repo deliberately does not have -- see the comment there). The same
      # two lines appear in every install-nix-action step across the workflows;
      # keep them identical. wiktor-nixos is named even where cachix-action
      # would also add it, so the block does not differ per job.
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-community.cachix.org https://cache.numtide.com https://wiktor-nixos.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= wiktor-nixos.cachix.org-1:3DOZHbBhM0h+YZFUZ1zZikBSLC7cTbZglgQEhF7Gi2M=
      - name: feature-coverage
        run: nix build -L '.#checks.x86_64-linux.feature-coverage'

  # Full VM feature tests. KVM can be flaky on runners — so not on every PR,
  # only on main and manually; green builds land in Cachix, so later ones are fast.
  feature-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # root-safe-haven: the action carves an expansion disk out of / and the
      # default 2 GB reserve is not enough for the runner's own diag logs —
      # the 59 feature-test build log filled / and killed the worker itself
      # with ENOSPC (while /nix still had ~95 GB free). Same fix as iso.yaml.
      - name: Free disk space
        uses: wimpysworld/nothing-but-nix@main
        with:
          root-safe-haven: '12288'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # build-dir MUST point at the /nix volume (nothing-but-nix creates
      # /nix/build exactly for this): without it the daemon builds the VM
      # images in /tmp on /, where little is left after the carve-out.
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-community.cachix.org https://cache.numtide.com https://wiktor-nixos.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= wiktor-nixos.cachix.org-1:3DOZHbBhM0h+YZFUZ1zZikBSLC7cTbZglgQEhF7Gi2M=
            build-dir = /nix/build
      - uses: cachix/cachix-action@v15
        with:
          name: wiktor-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build all feature tests
        run: |
          nix run nixpkgs#nix-fast-build -- \
            --no-nom \
            --skip-cached \
            --retries 2 \
            --cachix-cache wiktor-nixos \
            --flake '.#checks.x86_64-linux'
