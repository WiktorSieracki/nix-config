name: Feature tests

# Feature tests (see docs/adr/0002-ai-first-testable-features.md).
#  - coverage:      cheap eval-time gate (every feature has meta+test) — no KVM, on PRs.
#  - feature-tests: full VM feature tests (nixosTest) — needs KVM, on main / manual, via Cachix.

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: feature-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hard gate: meta ⇔ feature-test consistency. Cheap, KVM-independent — blocks PRs.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: feature-coverage
        run: nix build -L '.#checks.x86_64-linux.feature-coverage'

  # Full VM feature tests. KVM can be flaky on runners — so not on every PR,
  # only on main and manually; green builds land in Cachix, so later ones are fast.
  feature-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # root-safe-haven: the action carves an expansion disk out of / and the
      # default 2 GB reserve is not enough for the runner's own diag logs —
      # the 59 feature-test build log filled / and killed the worker itself
      # with ENOSPC (while /nix still had ~95 GB free). Same fix as iso.yaml.
      - name: Free disk space
        uses: wimpysworld/nothing-but-nix@main
        with:
          root-safe-haven: '12288'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # build-dir MUST point at the /nix volume (nothing-but-nix creates
      # /nix/build exactly for this): without it the daemon builds the VM
      # images in /tmp on /, where little is left after the carve-out.
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            build-dir = /nix/build
      - uses: cachix/cachix-action@v15
        with:
          name: wiktor-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build all feature tests
        run: |
          # eval-workers/eval-max-memory-size: nix-fast-build defaults to 4 workers
          # x 4096 MiB, which peaked at 13.6 GiB RSS evaluating the 61 checks --
          # against 16 GB on a hosted runner. The agent got OOM-killed mid-eval
          # and the job died with "The runner has received a shutdown signal",
          # intermittently, since it sat right at the edge. 2 x 2048 peaks at
          # 3.9 GiB for the same 61 attributes.
          nix run nixpkgs#nix-fast-build -- \
            --no-nom \
            --skip-cached \
            --retries 2 \
            --eval-workers 2 \
            --eval-max-memory-size 2048 \
            --cachix-cache wiktor-nixos \
            --flake '.#checks.x86_64-linux'
