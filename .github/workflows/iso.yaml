name: ISO Release

# Builds the generic live ISO (host `iso`) and publishes it as a rolling release
# under the tag `latest`. See docs/adr/0001-iso-release-pipeline.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Cancel the previous build if a newer push arrives.
concurrency:
  group: iso-release
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/overwrite the release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # nix-eval-jobs (under nix-fast-build) forces `revCount` on the
        # `git+file:.` input, which a shallow clone cannot provide:
        # "is a shallow Git repository, so 'revCount' is not available".
        # checkout defaults to fetch-depth 1, so the full history is required.
        with:
          fetch-depth: 0

      # ubuntu-latest has ~14 GB free; the ISO build doesn't fit in that.
      # root-safe-haven: Stage artifacts copies the ~4.2 GB ISO to the workspace on /,
      # and the default 2 GB reserve killed this step (and the worker itself) with ENOSPC.
      - name: Free disk space
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage
          root-safe-haven: '12288'

      # build-dir MUST point at the /nix volume (nothing-but-nix creates
      # /nix/build exactly for this): without it the daemon builds in /tmp on /,
      # where ~2 GB is left after cleanup — the ISO mksquashfs died there with ENOSPC
      # "Probably out of space on output filesystem".
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            build-dir = /nix/build

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: wiktor-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ISO
        run: |
          nix run nixpkgs#nix-fast-build -- \
            --no-nom \
            --skip-cached \
            --retries 3 \
            --cachix-cache wiktor-nixos \
            --out-link result \
            --flake 'git+file:.#nixosConfigurations.iso.config.system.build.isoImage'

      # nix-fast-build with --skip-cached does NOT create the result symlink when a
      # finished ISO is already in cachix — so we realise the out-link separately: a
      # no-op after a fresh build, a substitution from cache after a skip.
      # split: GitHub rejects release files >= 2 GiB ("size must be less
      # than 2147483648"), and the image is ~4.2 GB — we ship parts of 1990 MB
      # reassembled with `cat` (see the release body).
      - name: Stage artifacts
        run: |
          nix build 'git+file:.#nixosConfigurations.iso.config.system.build.isoImage' --out-link result
          split -b 1990M result/iso/*.iso nixos.iso.part-
          sha256sum nixos.iso.part-* > checksums.txt
          sha256sum result/iso/*.iso | awk '{print $1 "  nixos.iso"}' >> checksums.txt

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest ISO
          body: |
            The latest live ISO (host `iso`), built automatically from `main`.
            GitHub limits release files to 2 GiB, so the image is split —
            after downloading all parts, reassemble and verify it:
            ```
            cat nixos.iso.part-* > nixos.iso
            sha256sum -c checksums.txt
            ```

            Boot it and install the host of your choice:
            ```
            sudo nixos-install --flake github:${{ github.repository }}#desktopNixos
            sudo nixos-install --flake github:${{ github.repository }}#laptopNixos
            ```
          files: |
            nixos.iso.part-*
            checksums.txt
