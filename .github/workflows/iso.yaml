name: ISO Release

# Builds the minimal installer ISO (host `iso`) and publishes it as a rolling
# release under the tag `latest`.
#
# Manual trigger only. The image carries just the installer floor (see
# modules/hosts/iso), so it is near-identical from one commit to the next --
# rebuilding it on every push to `main` burned CI on a byte-for-byte reprint.
# What changes on every push is the host closure, and that is hosts.yaml's job.
# Cut a new image when the installer floor itself changes (kernel, core floor,
# the `nix`/`fish` features) or when the pendrive is simply old.
#
# The release stays on GitHub rather than being built locally on demand,
# because the one moment an installer is needed is the moment there is no
# working machine to build it on.

on:
  workflow_dispatch:

# Two manual runs at once would race on the `latest` tag.
concurrency:
  group: iso-release
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/overwrite the release
    steps:
      # fetch-depth: 0 is load-bearing. The build below addresses the flake as
      # `git+file:.`, and nix-eval-jobs (inside nix-fast-build) asks that ref
      # for `revCount`, which a shallow clone cannot answer:
      #   error: '...' is a shallow Git repository, so 'revCount' is not available
      # checkout@v4 clones shallow by default, so every run failed on this.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ubuntu-latest has ~14 GB free; the ISO build doesn't fit in that.
      # root-safe-haven: Stage artifacts copies the finished ISO to the workspace
      # on /, and the default 2 GB reserve killed this step (and the worker
      # itself) with ENOSPC. Kept generous even though the minimal image is far
      # smaller than the old ~4.2 GB desktop live one.
      - name: Free disk space
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage
          root-safe-haven: '12288'

      # build-dir MUST point at the /nix volume (nothing-but-nix creates
      # /nix/build exactly for this): without it the daemon builds in /tmp on /,
      # where ~2 GB is left after cleanup — the ISO mksquashfs died there with ENOSPC
      # "Probably out of space on output filesystem".
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            build-dir = /nix/build

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: wiktor-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ISO
        run: |
          nix run nixpkgs#nix-fast-build -- \
            --no-nom \
            --skip-cached \
            --retries 3 \
            --cachix-cache wiktor-nixos \
            --out-link result \
            --flake 'git+file:.#nixosConfigurations.iso.config.system.build.isoImage'

      # nix-fast-build with --skip-cached does NOT create the result symlink when a
      # finished ISO is already in cachix — so we realise the out-link separately: a
      # no-op after a fresh build, a substitution from cache after a skip.
      #
      # GitHub rejects release files >= 2 GiB ("size must be less than
      # 2147483648"). The desktop live image was ~4.2 GB and had to be shipped
      # as `split` parts; the minimal installer fits in one file, so guard the
      # limit instead of pre-emptively splitting — if this ever trips, the image
      # has grown something it should not carry.
      - name: Stage artifacts
        run: |
          nix build 'git+file:.#nixosConfigurations.iso.config.system.build.isoImage' --out-link result
          cp result/iso/*.iso nixos.iso
          size=$(stat -c %s nixos.iso)
          echo "ISO size: $size bytes"
          if [ "$size" -ge 2147483648 ]; then
            echo "ISO is >= 2 GiB — GitHub will reject the release asset." >&2
            exit 1
          fi
          sha256sum nixos.iso > checksums.txt

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest installer ISO
          body: |
            Minimal NixOS installer (host `iso`), built manually from `main`.
            It carries the installer floor only — `git`, `fish`, `nmtui`,
            partitioning tools and a Polish console keymap. The desktop is not
            on the image; it is fetched at install time.

            Verify the download:
            ```
            sha256sum -c checksums.txt
            ```

            Boot it (console login: `wiktor` / `nixos`), get networking up with
            `nmtui`, partition, mount under `/mnt`, then install the host you
            want:
            ```
            sudo nixos-install --flake github:${{ github.repository }}#desktopNixos --option accept-flake-config true
            sudo nixos-install --flake github:${{ github.repository }}#laptopNixos --option accept-flake-config true
            ```
            `accept-flake-config` opts into the substituters declared in
            `flake.nix`, so the closure comes down from the `wiktor-nixos`
            Cachix cache instead of being built on the fresh machine.
          files: |
            nixos.iso
            checksums.txt
