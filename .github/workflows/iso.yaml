name: ISO Release

# Buduje generyczny live ISO (host `iso`) i publikuje go jako rolling release
# pod tagiem `latest`. Patrz docs/adr/0001-iso-release-pipeline.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Anuluj poprzedni build, jeśli pojawi się nowszy push.
concurrency:
  group: iso-release
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tworzenie/nadpisywanie release'u
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ma ~14 GB wolnego; build ISO tego nie mieści.
      # root-safe-haven: Stage artifacts kopiuje ~4.2 GB ISO do workspace na /,
      # a domyślne 2 GB rezerwy zabijało ten krok (i samego workera) ENOSPC-em.
      - name: Free disk space
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage
          root-safe-haven: '12288'

      # build-dir MUSI wskazywać na wolumen /nix (nothing-but-nix tworzy
      # /nix/build dokładnie po to): bez tego demon buduje w /tmp na /, gdzie
      # po czystkach zostaje ~2 GB — mksquashfs ISO umierał tam z ENOSPC
      # "Probably out of space on output filesystem".
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            build-dir = /nix/build

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: wiktor-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ISO
        run: |
          nix run nixpkgs#nix-fast-build -- \
            --no-nom \
            --skip-cached \
            --retries 3 \
            --cachix-cache wiktor-nixos \
            --out-link result \
            --flake 'git+file:.#nixosConfigurations.iso.config.system.build.isoImage'

      - name: Stage artifacts
        run: |
          cp result*/iso/*.iso nixos.iso
          sha256sum nixos.iso > checksums.txt

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest ISO
          body: |
            Najnowszy live ISO (host `iso`), zbudowany automatycznie z `main`.

            Zbootuj go i zainstaluj wybrany host:
            ```
            sudo nixos-install --flake github:${{ github.repository }}#desktopNixos
            sudo nixos-install --flake github:${{ github.repository }}#laptopNixos
            ```
          files: |
            nixos.iso
            checksums.txt
