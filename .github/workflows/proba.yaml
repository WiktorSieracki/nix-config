name: Próba

# Testy feature'ów (patrz docs/adr/0002-ai-first-testable-features.md).
#  - coverage: tani gate eval-time (każdy feature ma meta+Próbę) — bez KVM, na PR.
#  - proba:    pełne Próby VM (nixosTest) — wymaga KVM, na main / ręcznie, z Cachix.

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: proba-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Twardy gate: spójność meta ⇔ Próba. Tani, niezależny od KVM — blokuje PR-y.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: feature-coverage
        run: nix build -L '.#checks.x86_64-linux.feature-coverage'

  # Pełne Próby VM. KVM bywa kapryśny na runnerach — dlatego nie na każdym PR,
  # tylko na main i ręcznie; green-buildy lądują w Cachix, więc kolejne są szybkie.
  proba:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: wimpysworld/nothing-but-nix@main
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - uses: cachix/cachix-action@v15
        with:
          name: wiktor-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build all Próby
        run: |
          nix run nixpkgs#nix-fast-build -- \
            --no-nom \
            --skip-cached \
            --retries 2 \
            --cachix-cache wiktor-nixos \
            --flake '.#checks.x86_64-linux'
